<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Biblioteca</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <script src="js/script.js" defer></script>
</head>
<body>
    <main class="container py-4">
        <h1>Biblioteca dos lindões</h1>

        <!-- alerta do cadastro -->
        <div id="mensagem" class="alert d-none"></div>

        <div class="row g-4">
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body">

                        <h2 class="h5">Cadastrar material</h2>

                        <form id="form-material" novalidate>

                            <!-- campos que tem em todo mundo, no caso tem no livro e na revista -->

                            <div class="mb-3">
                                <label for="tipo" class="form-label">Tipo</label>
                                <select class="form-select" id="tipo">
                                    <option value="livro">Livro</option>
                                    <option value="revista">Revista</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label for="titulo" class="form-label">Título</label>
                                <input type="text" id="titulo" class="form-control">
                            </div>

                            <div class="mb-3">
                                <label for="ano" class="form-label">Ano de publicação</label>
                                <input type="number" id="ano" class="form-control">
                            </div>

                            <!-- separando aqui vaão ser os campos que tem só no livro -->

                            <div id="campos-livro">

                                <div class="mb-3">
                                    <label for="autor" class="form-label">Autor</label>
                                    <input type="text" id="autor" class="form-control">
                                </div>

                                <div class="mb-3">
                                    <label for="paginas" class="form-label">Páginas</label>
                                    <input type="number" id="paginas" class="form-control">
                                </div>

                            </div>

                            <!-- agora os que tem somente na revista -->

                            <div id="campos-revista" class="d-none">

                                <div class="mb-3">
                                    <label for="edicao" class="form-label">Edição</label>
                                    <input type="number" id="edicao" class="form-control">
                                </div>

                                <div class="mb-3">
                                    <label for="mes" class="form-label">Mês</label>
                                    <input type="number" id="mes" class="form-control" min="1" max="12">
                                </div>
                                
                            </div>

                            <button type="submit" class="btn btn-primary w-100">Cadastrar</button>
                        </form>

                    </div>
                </div>
            </div>

            <!-- materiais (parte direita) -->

            <div class="col-md-8">
                <div class="card">
                    <div class="card-body">
                        <h2 class="h5">Materiais</h2>

                        <table class="table table-striped align-middle">
                            <thead>
                                <tr>
                                    <th>Id</th>
                                    <th>Tipo</th>
                                    <th>Descrição</th>
                                    <th class="text-end">Ações</th>
                                </tr>
                            </thead>
                            <tbody id="tabela-materiais">
                                <tr>
                                    <td colspan="4">Carregando...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
